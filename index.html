<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrock Tiers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>⚔️ Bedrock Tiers</h1>
  <p>Minecraft Bedrock Player Rankings</p>
</header>

<nav>
  <button onclick="showPage('home')">Home</button>
  <button onclick="showPage('rankings')">Rankings</button>
  <button onclick="showPage('players')">Players</button>
</nav>

<main>

  <section id="home" class="page">
    <h2>🏆 Bedrock Tier List</h2>

    <input
      type="text"
      id="search"
      placeholder="Search player..."
      onkeyup="searchPlayers()"
    >

    <div id="tierList"></div>
  </section>

  <section id="rankings" class="page hidden">
    <h2>📊 Rankings</h2>
    <div id="rankingList"></div>
  </section>

  <section id="players" class="page hidden">
    <h2>👤 Players</h2>
    <div id="playerList"></div>
  </section>

</main>

<footer>
  <p>Bedrock Tiers © 2026</p>
</footer>

<script src="script.js"></script>

</body>
    </html>
